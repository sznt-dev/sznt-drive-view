name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build and test
        shell: pwsh
        env:
          SZNT_MINGW: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin
        run: ./build.ps1

      - name: SHA-256 of this build
        shell: pwsh
        run: Get-Content (Get-ChildItem dist -Recurse -Filter SHA256SUMS.txt).FullName
