<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0E12"/>
      <stop offset="1" stop-color="#151920"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#F2A900" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F2A900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="-0.1" r="0.5">
      <stop offset="0" stop-color="#F2A900" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F2A900" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow2)"/>

  <g transform="translate(210 210)">
    <circle r="92" fill="none" stroke="#EDEFF3" stroke-width="20"/>
    <path d="M -86.4 -31.4 A 92 92 0 0 1 86.4 -31.4" fill="none" stroke="#F2A900" stroke-width="20" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="-84" y2="0" stroke="#EDEFF3" stroke-width="17" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="84" y2="0" stroke="#EDEFF3" stroke-width="17" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="0" y2="84" stroke="#EDEFF3" stroke-width="17" stroke-linecap="round"/>
    <circle r="24" fill="#F2A900"/>
  </g>

  <g font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">
    <text x="360" y="150" fill="#F2A900" font-size="22" font-weight="700" letter-spacing="6">SZNT</text>
    <text x="358" y="222" fill="#EDEFF3" font-size="68" font-weight="700">Drive <tspan fill="#5A616E">&amp;</tspan> View</text>
    <text x="360" y="272" fill="#A9B0BB" font-size="27">Feel the truck, not the keyboard.</text>
    <text x="360" y="322" fill="#6B7280" font-size="19">Euro Truck Simulator 2  ·  American Truck Simulator  ·  keyboard &amp; mouse</text>
  </g>
</svg>
