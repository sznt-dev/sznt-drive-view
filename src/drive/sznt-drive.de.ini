; =====================================================================================
;  SZNT DRIVE 1.0 beta - realistische Lenkung, Pedale und Gewicht auf der Tastatur (ETS2 / ATS)
; =====================================================================================
;  Ändere die Zahl nach dem = und SPEICHERE. Das Spiel liest die Datei nach einer halben Sekunde neu
;  (kein Neustart nötig). Zeilen mit ; sind nur Erklärungen. Zeile gelöscht? Dann gilt der Standardwert.
;
;  Einheit der Lenkung: 1.0 = Lenkrad am Anschlag.
;  "Rangieren" = bis speed_low_kmh. "Straße" = ab speed_high_kmh.
;  Dazwischen mischt das Plugin die Werte allmählich.
;
;  Die Werte für Lenkung, Gas und Bremse unten gelten für einen Truck mit SCHWERER LADUNG.
;  Der Abschnitt [gewicht] macht alles leichter ohne Ladung und schwerer mit größeren Ladungen.
; =====================================================================================

[allgemein]
enabled = 1                 ; 1 = an, 0 = aus (W A S D tun nichts)
output = 0                  ; 0 = automatisch, 1 = virtueller Joystick, 2 = semantical. 0 lassen
debug = 0                   ; 1 = schreibt Tempo/Lenkung/Pedale/Gewicht/Grip in game.log.txt

[tasten]                    ; Windows-Tastencodes (0x41 = A, 0x44 = D, 0x57 = W, 0x53 = S)
key_left = 0x41
key_right = 0x44
key_throttle = 0x57
key_brake = 0x53

[lenkung]
speed_low_kmh = 5           ; bis hier: Rangierverhalten
speed_high_kmh = 80         ; ab hier: Straßenverhalten
steer_rate_low = 0.36       ; wie schnell das Lenkrad beim Halten der Taste dreht, beim Rangieren (pro Sekunde)
steer_rate_high = 0.08      ; ... auf der Straße. Kleiner = schwerer/langsamer
steer_ramp_time = 2.4       ; Sekunden Halten, bis das Lenkrad seine volle Drehgeschwindigkeit erreicht (sanfte Kurve)
steer_start_high = 0.28     ; kleine Korrekturen (kurzes Tippen). Kleiner = schwerer
steer_hold_high = 2.0       ; beim Halten beschleunigt das Lenkrad bis zum X-fachen der Grundgeschwindigkeit (enge Kurven)
steer_start_highway = 0.33  ; kleine Korrekturen über highway_kmh (etwas leichter)
highway_kmh = 60            ; km/h, ab denen steer_start_highway gilt
counter_mult = 2.5          ; mit der Gegentaste kehrt das Lenkrad X-mal schneller zur Mitte zurück
lock_low = 1.00             ; maximaler Lenkeinschlag beim Rangieren
lock_high = 0.15            ; maximaler Lenkeinschlag auf der Straße (verhindert gefährliches Ausbrechen)
center_rate = 0.12          ; Rückstellung beim Loslassen: konstanter Anteil (pro Sekunde, bei hohem Tempo)
center_spring = 1.6         ; Rückstellung: "Feder"-Anteil (mehr Einschlag = stärkere Rückstellung)
center_speed_ref = 40       ; km/h, bei denen die Rückstellung die halbe Kraft erreicht
center_delay = 0.0          ; zusätzliche Wartezeit (s) vor der Rückstellung. 0 = die Trägheit übernimmt den Übergang
coast_time = 0.15           ; TRÄGHEIT beim Loslassen: das Lenkrad dreht kurz nach, bevor es zurückkehrt (s)
center_ramp = 2.5           ; Sekunden, bis die Rückstellung beim Rangieren die volle Kraft erreicht
center_ramp_high = 0.6      ; ... auf der Straße (Rückstellung gleich nach der Trägheit)
center_fast_kmh = 30        ; km/h, ab denen die schnelle Rückstellung gilt
center_curve = 1.5          ; Form der Rückstellung: >1 = beginnt sehr sanft und wird schneller (1 = konstant)
center_stopped = 0.0        ; Rückstellung im Stand (0 = das Lenkrad bleibt, wo du es gelassen hast)
steer_smooth = 0.05         ; abschließende Glättung in Sekunden (größer = weicher, aber verzögert)

[gas]
throttle_rise = 9.0         ; Sekunden W halten bis 100%
throttle_fall = 1.2         ; Sekunden, bis der Fuß das Gaspedal verlässt
throttle_curve = 1.9        ; größer als 1 = feinfühligerer Anfang (gut zum langsamen Anfahren)
throttle_ease_out = 1.6     ; größer als 1 = kurz vor dem Anschlag wird der Fuß langsamer (kein Ruck). 1 = aus
pedal_memory = 3.0          ; nach dem Loslassen von W (z. B. Schalten) "merkt" sich der Fuß die Stellung
memory_rise = 0.8           ; erneut drücken: schnell zurück zur alten Stellung (s von 0 bis 100%), dann normal weiter
; VOLLGAS: W tippen, loslassen und schnell erneut drücken und halten = tiefer treten (Steigungen, Überholen)
boost_rise = 3.5            ; Sekunden bis 100% bei Vollgas
boost_curve = 1.3           ; Vollgas-Kurve (kleiner = gleich von Anfang an stärker)
tap_window = 0.35           ; maximale Zeit (s) für Tippen und Pause, um als Doppeltippen zu zählen

[bremse]
brake_rise = 3.0            ; Sekunden S halten bis 100%
brake_fall = 0.6            ; Sekunden zum Lösen der Bremse
brake_curve = 1.25          ; größer als 1 = kurzes Tippen bremst ganz sanft
brake_start = 0.04          ; die Bremse beginnt schon mit so viel (Beläge liegen an)
; NOTBREMSE: S tippen, loslassen und schnell erneut drücken und halten = stärker treten
brake_boost_rise = 1.3      ; Sekunden bis 100% bei der Notbremsung
brake_boost_curve = 1.1     ; Kurve der Notbremse

[gewicht]
; Das Plugin addiert: Zugmaschine + angekuppelte Auflieger + Auftragsladung (das Spiel meldet die Ladungsmasse).
; Bei der Referenzmasse gelten genau die Werte oben. Darunter wird alles leichter, darüber schwerer.
;   Beispiele mit den Standardwerten (Gas bis 100% / Lenkgeschwindigkeit):
;   nur Zugmaschine 8,5 t ..... 6,1 s / +26%      leerer Auflieger 15,5 t .. 7,1 s / +15%
;   10 t Ladung (25,5 t) ...... 8,0 s / +7%       24,5 t Ladung (40 t) ..... 9,0 s / gleich
;   40 t Ladung (55,5 t) ...... 9,7 s / -5%       Schwertransport 80 t ..... 11,1 s / -12%
weight_enabled = 1          ; 1 = an, 0 = immer wie schwere Ladung
weight_reference_t = 40     ; Gesamtmasse (t), bei der die Werte oben gelten
truck_mass_t = 8.5          ; Masse der Zugmaschine (t)
trailer_mass_t = 7.0        ; Masse jedes leeren Aufliegers (t)
weight_steer = 0.15         ; wie stark das Gewicht die Lenkgeschwindigkeit ändert (0 = gar nicht)
weight_throttle = 0.25      ; wie stark das Gewicht die Gaszeit ändert (0 = gar nicht)
weight_brake = 0.15         ; wie stark das Gewicht die Bremszeit ändert (0 = gar nicht)
weight_smooth = 4.0         ; ändert sich das Gewicht während der Fahrt, wird es allmählich übernommen (s). Im Stand sofort
weight_override_t = 0       ; TEST: erzwingt eine Gesamtmasse (t), um den Unterschied zu spüren. 0 = automatisch

[grip]
; Auf Eis, Schnee, Schlamm, Gras und Schotter (und nassem Asphalt) haften die Reifen weniger: das Lenkrad wird
; leicht und stellt sich kaum noch selbst zurück. Das Plugin liest den Untergrund unter den Vorderrädern; Regen = Scheibenwischer an.
grip_enabled = 1            ; 1 = an, 0 = aus
grip_center = 0.6           ; wie stark die Rückstellung ohne Grip nachlässt (0 = gar nicht, 1 = verschwindet auf Eis)
grip_light = 0.15           ; wie viel leichter das Lenkrad ohne Grip dreht (0.15 = bis zu +15%)
grip_rain = 0.85            ; Grip des Asphalts bei eingeschaltetem Scheibenwischer (1 = wie trocken)
grip_smooth = 0.5           ; Sekunden, bis ein Untergrundwechsel am Lenkrad ankommt
;   Grip je Untergrund: Asphalt/Beton 1.0, Metall 0.85, Holz 0.8, Feldweg 0.75,
;   Schotter 0.7, Erde 0.65, Gras 0.6, verschneite Straße 0.5, Schnee 0.4, Eis 0.2
