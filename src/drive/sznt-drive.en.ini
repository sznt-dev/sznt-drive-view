; =====================================================================================
;  SZNT DRIVE 1.0 beta - realistic keyboard steering, pedals and weight (ETS2 / ATS)
; =====================================================================================
;  Change the number after = and SAVE. The game reloads it within half a second (no restart
;  needed). Lines starting with ; are comments. Deleted a line? The default value comes back.
;
;  Steering unit: 1.0 = steering wheel at full lock.
;  "Maneuvering" = up to speed_low_kmh. "Road" = from speed_high_kmh up.
;  In between, the plugin blends both gradually.
;
;  The steering, throttle and brake values below are for a truck with a HEAVY LOAD.
;  The [weight] section makes everything lighter when empty and heavier with bigger loads.
; =====================================================================================

[general]
enabled = 1                 ; 1 = on, 0 = off (W A S D do nothing)
output = 0                  ; 0 = automatic, 1 = virtual joystick, 2 = semantical. Keep 0
debug = 0                   ; 1 = writes speed/steering/pedals/weight/grip to game.log.txt

[keys]                      ; Windows key codes (0x41 = A, 0x44 = D, 0x57 = W, 0x53 = S)
key_left = 0x41
key_right = 0x44
key_throttle = 0x57
key_brake = 0x53

[steering]
speed_low_kmh = 5           ; up to here: maneuvering behavior
speed_high_kmh = 80         ; from here up: road behavior
steer_rate_low = 0.36       ; how fast the wheel turns while holding the key, maneuvering (per second)
steer_rate_high = 0.08      ; ... on the road. Lower = heavier/slower
steer_ramp_time = 2.4       ; seconds holding until the wheel reaches full turning speed (smooth curve)
steer_start_high = 0.28     ; small corrections (short taps). Lower = heavier
steer_hold_high = 2.0       ; holding the key, the wheel speeds up to X times the base speed (sharp turns)
steer_start_highway = 0.33  ; small corrections above highway_kmh (a bit lighter)
highway_kmh = 60            ; km/h from which steer_start_highway applies
counter_mult = 2.5          ; with the opposite key, the wheel returns to center X times faster
lock_low = 1.00             ; max steering lock while maneuvering
lock_high = 0.15            ; max steering lock on the road (prevents dangerous swerves)
center_rate = 0.12          ; self-centering when released: constant part (per second, at high speed)
center_spring = 1.6         ; self-centering: "spring" part (more lock = stronger return)
center_speed_ref = 40       ; km/h where self-centering reaches half its strength
center_delay = 0.0          ; extra wait (s) before returning. 0 = inertia already blends it
coast_time = 0.15           ; INERTIA on release: the wheel finishes turning before returning (s)
center_ramp = 2.5           ; seconds for self-centering to reach full strength, maneuvering
center_ramp_high = 0.6      ; ... on the road (returns right after the inertia)
center_fast_kmh = 30        ; km/h from which the fast self-centering applies
center_curve = 1.5          ; return shape: >1 = starts very soft and speeds up (1 = constant)
center_stopped = 0.0        ; self-centering when stopped (0 = the wheel stays where you left it)
steer_smooth = 0.05         ; final smoothing in seconds (higher = softer, but delayed)

[throttle]
throttle_rise = 9.0         ; seconds holding W to reach 100%
throttle_fall = 1.2         ; seconds for the foot to leave the pedal on release
throttle_curve = 1.9        ; above 1 = more delicate start (good for pulling away slowly)
throttle_ease_out = 1.6     ; above 1 = the foot slows down near the floor (no jolt). 1 = off
pedal_memory = 3.0          ; after releasing W (e.g. gear change), the foot "remembers" where it was
memory_rise = 0.8           ; pressing again, it quickly returns there (s from 0 to 100%), then continues
; FLOOR IT: tap W, release and press again holding (quickly) = pushes deeper (hills, overtaking)
boost_rise = 3.5            ; seconds to 100% when flooring it
boost_curve = 1.3           ; floor-it curve (lower = stronger right away)
tap_window = 0.35           ; max time (s) of the tap and the pause to count as a double tap

[brake]
brake_rise = 3.0            ; seconds holding S to reach 100%
brake_fall = 0.6            ; seconds to release the brake
brake_curve = 1.25          ; above 1 = short taps brake very gently
brake_start = 0.04          ; the brake already starts at this much (pads touching)
; EMERGENCY BRAKE: tap S, release and press again holding (quickly) = pushes harder
brake_boost_rise = 1.3      ; seconds to 100% on emergency braking
brake_boost_curve = 1.1     ; emergency brake curve

[weight]
; The plugin adds: tractor + coupled trailers + job cargo (the game reports the cargo mass).
; At the reference mass the values above apply exactly. Below it everything gets lighter, above it heavier.
;   Examples with the default values (throttle to 100% / steering speed):
;   tractor only 8.5 t ........ 6.1 s / +26%      empty trailer 15.5 t ..... 7.1 s / +15%
;   10 t cargo (25.5 t) ....... 8.0 s / +7%       24.5 t cargo (40 t) ...... 9.0 s / same
;   40 t cargo (55.5 t) ....... 9.7 s / -5%       80 t heavy haul .......... 11.1 s / -12%
weight_enabled = 1          ; 1 = on, 0 = always behaves as heavy load
weight_reference_t = 40     ; total mass (t) where the values above apply
truck_mass_t = 8.5          ; tractor mass (t)
trailer_mass_t = 7.0        ; mass of each empty trailer (t)
weight_steer = 0.15         ; how much weight changes the steering speed (0 = none)
weight_throttle = 0.25      ; how much weight changes the throttle time (0 = none)
weight_brake = 0.15         ; how much weight changes the brake time (0 = none)
weight_smooth = 4.0         ; if the weight changes while driving, it blends in (s). Stopped, it applies at once
weight_override_t = 0       ; TEST: forces a total mass (t) to feel the difference. 0 = automatic

[grip]
; On ice, snow, mud, grass and gravel (and wet asphalt) the tires grip less: the wheel gets light and
; barely returns to center by itself. The plugin reads the surface under the front wheels; rain = wipers on.
grip_enabled = 1            ; 1 = on, 0 = off
grip_center = 0.6           ; how much self-centering weakens without grip (0 = none, 1 = vanishes on ice)
grip_light = 0.15           ; how much lighter the wheel turns without grip (0.15 = up to +15%)
grip_rain = 0.85            ; asphalt grip with the wipers on (1 = same as dry)
grip_smooth = 0.5           ; seconds for a surface change to reach the wheel
;   Grip per surface: asphalt/concrete 1.0, metal 0.85, wood 0.8, dirt road 0.75,
;   gravel 0.7, dirt 0.65, grass 0.6, snowy road 0.5, snow 0.4, ice 0.2
