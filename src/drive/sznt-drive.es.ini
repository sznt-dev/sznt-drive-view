; =====================================================================================
;  SZNT DRIVE 1.0 beta - dirección, pedales y peso realistas en el teclado (ETS2 / ATS)
; =====================================================================================
;  Cambia el número después del = y GUARDA. El juego lo vuelve a leer en medio segundo (no hace
;  falta reiniciar). Las líneas con ; son solo explicación. ¿Borraste una línea? Vuelve el valor por defecto.
;
;  Unidad de la dirección: 1.0 = volante a tope.
;  "Maniobra" = hasta speed_low_kmh. "Carretera" = desde speed_high_kmh.
;  Entre las dos, el plugin mezcla los valores poco a poco.
;
;  Los valores de dirección, acelerador y freno de abajo son los del camión con CARGA PESADA.
;  La sección [peso] lo hace todo más ligero sin carga y más pesado con cargas mayores.
; =====================================================================================

[general]
enabled = 1                 ; 1 = activado, 0 = desactivado (W A S D no hacen nada)
output = 0                  ; 0 = automático, 1 = joystick virtual, 2 = semantical. Deja 0
debug = 0                   ; 1 = escribe velocidad/volante/pedales/peso/agarre en game.log.txt

[teclas]                    ; códigos de tecla de Windows (0x41 = A, 0x44 = D, 0x57 = W, 0x53 = S)
key_left = 0x41
key_right = 0x44
key_throttle = 0x57
key_brake = 0x53

[direccion]
speed_low_kmh = 5           ; hasta aquí: comportamiento de maniobra
speed_high_kmh = 80         ; desde aquí: comportamiento de carretera
steer_rate_low = 0.36       ; qué tan rápido gira el volante manteniendo la tecla, en maniobra (por segundo)
steer_rate_high = 0.08      ; ... en carretera. Menor = más pesado/lento
steer_ramp_time = 2.4       ; segundos manteniendo hasta que el volante alcanza su velocidad máxima (curva suave)
steer_start_high = 0.28     ; correcciones pequeñas (toques cortos). Menor = más pesado
steer_hold_high = 2.0       ; manteniendo la tecla, el volante acelera hasta X veces la velocidad base (curvas cerradas)
steer_start_highway = 0.33  ; correcciones pequeñas por encima de highway_kmh (un poco más ligeras)
highway_kmh = 60            ; km/h desde los que vale steer_start_highway
counter_mult = 2.5          ; con la tecla contraria, el volante vuelve al centro X veces más rápido
lock_low = 1.00             ; giro máximo en maniobra
lock_high = 0.15            ; giro máximo en carretera (evita volantazos peligrosos)
center_rate = 0.12          ; vuelta al centro al soltar: parte constante (por segundo, a alta velocidad)
center_spring = 1.6         ; vuelta al centro: parte "muelle" (más giro = vuelve con más fuerza)
center_speed_ref = 40       ; km/h en los que la vuelta al centro llega a la mitad de su fuerza
center_delay = 0.0          ; espera extra (s) antes de volver. 0 = la inercia ya hace la transición
coast_time = 0.15           ; INERCIA al soltar: el volante termina de girar antes de volver (s)
center_ramp = 2.5           ; segundos para que la vuelta al centro llegue a su fuerza total, en maniobra
center_ramp_high = 0.6      ; ... en carretera (vuelve justo después de la inercia)
center_fast_kmh = 30        ; km/h desde los que la vuelta al centro ya es la rápida
center_curve = 1.5          ; forma de la vuelta: >1 = empieza muy suave y acelera (1 = constante)
center_stopped = 0.0        ; vuelta al centro con el camión parado (0 = el volante se queda donde lo dejaste)
steer_smooth = 0.05         ; suavizado final en segundos (mayor = más suave, pero con retraso)

[acelerador]
throttle_rise = 9.0         ; segundos manteniendo W para llegar al 100%
throttle_fall = 1.2         ; segundos para que el pie suelte el acelerador
throttle_curve = 1.9        ; mayor que 1 = inicio más delicado (bueno para arrancar despacio)
throttle_ease_out = 1.6     ; mayor que 1 = cerca del fondo el pie frena (sin tirones). 1 = desactivado
pedal_memory = 3.0          ; al soltar W (p. ej. cambio de marcha), el pie "recuerda" dónde estaba
memory_rise = 0.8           ; al pisar otra vez vuelve rápido hasta ahí (s de 0 a 100%) y luego sigue normal
; A FONDO: pulsa W, suelta y vuelve a pulsar manteniendo (rápido) = pisa más hondo (cuestas, adelantamientos)
boost_rise = 3.5            ; segundos hasta el 100% a fondo
boost_curve = 1.3           ; curva a fondo (menor = más fuerte desde el principio)
tap_window = 0.35           ; tiempo máximo (s) del toque y la pausa para contar como doble toque

[freno]
brake_rise = 3.0            ; segundos manteniendo S para llegar al 100%
brake_fall = 0.6            ; segundos para soltar el freno
brake_curve = 1.25          ; mayor que 1 = los toques cortos frenan muy suave
brake_start = 0.04          ; el freno ya empieza con esto (pastillas tocando)
; FRENO DE EMERGENCIA: pulsa S, suelta y vuelve a pulsar manteniendo (rápido) = pisa más fuerte
brake_boost_rise = 1.3      ; segundos hasta el 100% en frenada de emergencia
brake_boost_curve = 1.1     ; curva del freno de emergencia

[peso]
; El plugin suma: tractora + remolques enganchados + carga del trabajo (el juego informa la masa de la carga).
; En la masa de referencia valen exactamente los valores de arriba. Por debajo todo es más ligero, por encima más pesado.
;   Ejemplos con los valores por defecto (acelerador al 100% / velocidad del volante):
;   solo la tractora 8,5 t .... 6,1 s / +26%      remolque vacío 15,5 t .... 7,1 s / +15%
;   carga de 10 t (25,5 t) .... 8,0 s / +7%       carga de 24,5 t (40 t) ... 9,0 s / igual
;   carga de 40 t (55,5 t) .... 9,7 s / -5%       carga especial 80 t ...... 11,1 s / -12%
weight_enabled = 1          ; 1 = activado, 0 = siempre como carga pesada
weight_reference_t = 40     ; masa total (t) en la que valen los valores de arriba
truck_mass_t = 8.5          ; masa de la tractora (t)
trailer_mass_t = 7.0        ; masa de cada remolque vacío (t)
weight_steer = 0.15         ; cuánto cambia el peso la velocidad del volante (0 = nada)
weight_throttle = 0.25      ; cuánto cambia el peso el tiempo del acelerador (0 = nada)
weight_brake = 0.15         ; cuánto cambia el peso el tiempo del freno (0 = nada)
weight_smooth = 4.0         ; si el peso cambia en marcha, entra poco a poco (s). Parado, se aplica al instante
weight_override_t = 0       ; PRUEBA: fuerza una masa total (t) para sentir la diferencia. 0 = automático

[agarre]
; En hielo, nieve, barro, hierba y grava (y asfalto mojado) los neumáticos agarran menos: el volante se
; aligera y casi no vuelve solo al centro. El plugin lee el suelo bajo las ruedas delanteras; lluvia = limpiaparabrisas.
grip_enabled = 1            ; 1 = activado, 0 = desactivado
grip_center = 0.6           ; cuánto se debilita la vuelta al centro sin agarre (0 = nada, 1 = desaparece en hielo)
grip_light = 0.15           ; cuánto más ligero gira el volante sin agarre (0.15 = hasta +15%)
grip_rain = 0.85            ; agarre del asfalto con el limpiaparabrisas encendido (1 = igual que seco)
grip_smooth = 0.5           ; segundos para que el cambio de suelo llegue al volante
;   Agarre por suelo: asfalto/hormigón 1.0, metal 0.85, madera 0.8, camino de tierra 0.75,
;   grava 0.7, tierra 0.65, hierba 0.6, carretera con nieve 0.5, nieve 0.4, hielo 0.2
