; =====================================================================================
;  SZNT DRIVE 1.0 beta - direcao, pedais e peso realistas no teclado (ETS2 / ATS)
; =====================================================================================
;  Mude o numero depois do = e SALVE. O jogo le de novo em meio segundo (nao precisa
;  reiniciar). Linhas com ; sao so explicacao. Apagou uma linha? Volta o valor padrao.
;
;  Unidade da direcao: 1.0 = volante no batente (esterco total).
;  "Manobra" = ate speed_low_kmh. "Estrada" = a partir de speed_high_kmh.
;  Entre as duas, o plugin mistura os valores aos poucos.
;
;  Os valores de direcao, acelerador e freio abaixo sao os do caminhao com CARGA PESADA.
;  A secao [peso] deixa tudo mais leve sem carga e mais pesado com cargas maiores.
; =====================================================================================

[geral]
enabled = 1                 ; 1 = ligado, 0 = desligado (W A S D ficam sem fazer nada)
output = 0                  ; 0 = automatico, 1 = joystick virtual, 2 = semantical. Deixe 0
debug = 0                   ; 1 = escreve no game.log.txt velocidade/volante/pedais/peso/aderencia

[teclas]                    ; codigos de tecla do Windows (0x41 = A, 0x44 = D, 0x57 = W, 0x53 = S)
key_left = 0x41
key_right = 0x44
key_throttle = 0x57
key_brake = 0x53

[direcao]
speed_low_kmh = 5           ; ate aqui: comportamento de manobra
speed_high_kmh = 80         ; daqui pra cima: comportamento de estrada
steer_rate_low = 0.36       ; quao rapido o volante gira segurando a tecla, em manobra (por segundo)
steer_rate_high = 0.08      ; ... na estrada. Menor = mais pesado/lento
steer_ramp_time = 2.4       ; segundos segurando ate a aceleracao do volante chegar no maximo (curva suave)
steer_start_high = 0.28     ; pequenos ajustes (toques curtos). Menor = mais pesado
steer_hold_high = 2.0       ; segurando a tecla, o volante acelera ate X vezes a velocidade base (curvas fortes)
steer_start_highway = 0.33  ; pequenos ajustes acima de highway_kmh (um pouco mais leves)
highway_kmh = 60            ; km/h a partir do qual vale o steer_start_highway
counter_mult = 2.5          ; com a tecla contraria, o volante volta pro centro X vezes mais rapido que vira
lock_low = 1.00             ; esterco maximo em manobra
lock_high = 0.15            ; esterco maximo na estrada (evita guinadas perigosas)
center_rate = 0.12          ; volta ao centro ao soltar: parte constante (por segundo, em alta velocidade)
center_spring = 1.6         ; volta ao centro: parte "mola" (mais esterco = volta mais forte)
center_speed_ref = 40       ; km/h em que a volta ao centro chega a metade da forca
center_delay = 0.0          ; espera extra (s) antes de comecar a voltar. 0 = a inercia ja faz a transicao
coast_time = 0.15           ; INERCIA ao soltar: o volante termina de girar aos poucos antes de voltar (s)
center_ramp = 2.5           ; segundos para a volta ao centro chegar na forca total, em manobra
center_ramp_high = 0.6      ; ... na estrada (volta ao centro logo depois da inercia)
center_fast_kmh = 30        ; km/h a partir do qual a volta ao centro ja e a rapida
center_curve = 1.5          ; formato da volta: >1 = comeca bem leve e acelera no meio (1 = constante)
center_stopped = 0.0        ; volta ao centro com o caminhao parado (0 = o volante fica onde voce deixou)
steer_smooth = 0.05         ; suavizacao final em segundos (maior = mais macio, mas atrasa)

[acelerador]
throttle_rise = 9.0         ; segundos segurando W para chegar a 100%
throttle_fall = 1.2         ; segundos para o pe sair do acelerador ao soltar
throttle_curve = 1.9        ; maior que 1 = comeco mais delicado (bom pra sair devagar)
throttle_ease_out = 1.6     ; maior que 1 = perto do fundo o pe desacelera (sem tranco depois de segurar). 1 = desliga
pedal_memory = 3.0          ; ao soltar W (ex.: troca de marcha), o pe "lembra" onde estava por uns segundos
memory_rise = 0.8           ; ao pisar de novo, volta rapido ate onde estava (s de 0 a 100%), depois segue normal
; PE FUNDO: aperte W, solte e aperte de novo segurando (rapido) = pisa mais fundo (subidas, ultrapassagem)
boost_rise = 3.5            ; segundos para chegar a 100% no pe fundo
boost_curve = 1.3           ; curva do pe fundo (menor = mais forte logo no comeco)
tap_window = 0.35           ; tempo maximo (s) do toque e da pausa para valer como "duas vezes"

[freio]
brake_rise = 3.0            ; segundos segurando S para chegar a 100%
brake_fall = 0.6            ; segundos para soltar o freio
brake_curve = 1.25          ; maior que 1 = toque curto freia bem de leve
brake_start = 0.04          ; o freio ja comeca com este tanto (encosta a pastilha)
; FREIO DE EMERGENCIA: aperte S, solte e aperte de novo segurando (rapido) = pisa mais forte
brake_boost_rise = 1.3      ; segundos ate 100% no freio de emergencia
brake_boost_curve = 1.1     ; curva do freio de emergencia

[peso]
; O plugin soma: cavalo + carretas engatadas + carga do frete (o jogo informa a massa da carga).
; Na massa de referencia vale exatamente o que esta acima. Abaixo dela fica mais leve, acima mais pesado.
;   Exemplos com os valores padrao (acelerador ate 100% / velocidade do volante):
;   so o cavalo 8,5 t ......... 6,1 s / +26%      carreta vazia 15,5 t ... 7,1 s / +15%
;   carga de 10 t (25,5 t) .... 8,0 s / +7%       carga de 24,5 t (40 t) . 9,0 s / igual
;   carga de 40 t (55,5 t) .... 9,7 s / -5%       carga especial 80 t .... 11,1 s / -12%
weight_enabled = 1          ; 1 = ligado, 0 = sempre como carga pesada (como era antes)
weight_reference_t = 40     ; massa total (t) em que vale o ajuste acima
truck_mass_t = 8.5          ; massa do cavalo (t)
trailer_mass_t = 7.0        ; massa de cada carreta vazia (t)
weight_steer = 0.15         ; quanto o peso muda a velocidade do volante (0 = nada)
weight_throttle = 0.25      ; quanto o peso muda o tempo do acelerador (0 = nada)
weight_brake = 0.15         ; quanto o peso muda o tempo do freio (0 = nada)
weight_smooth = 4.0         ; se o peso mudar com o caminhao andando, entra aos poucos (s). Parado, vale na hora
weight_override_t = 0       ; TESTE: forca uma massa total (t) para sentir a diferenca. 0 = automatico

[aderencia]
; No gelo, neve, barro, grama e cascalho (e no asfalto molhado) o pneu agarra menos: o volante fica
; leve e quase nao volta sozinho ao centro. O plugin le o piso sob as rodas da frente; chuva = limpador ligado.
grip_enabled = 1            ; 1 = ligado, 0 = desligado
grip_center = 0.6           ; quanto a volta ao centro enfraquece sem aderencia (0 = nada, 1 = some no gelo)
grip_light = 0.15           ; quanto o volante fica mais leve de girar sem aderencia (0.15 = ate +15%)
grip_rain = 0.85            ; aderencia do asfalto com o limpador ligado (1 = igual ao seco)
grip_smooth = 0.5           ; segundos para a mudanca de piso chegar ao volante
;   Aderencia por piso: asfalto/concreto 1.0, metal 0.85, madeira 0.8, estrada de terra 0.75,
;   cascalho 0.7, terra 0.65, grama 0.6, neve na estrada 0.5, neve 0.4, gelo 0.2
