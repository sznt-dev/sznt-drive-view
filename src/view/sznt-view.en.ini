; =====================================================================================
;  SZNT VIEW 1.0 beta - realistic head and gaze in the cab (ETS2 / ATS)
; =====================================================================================
;  Works like a virtual head tracker (like TrackIR). Change the number and SAVE:
;  the game reloads it within half a second. Lines starting with ; are comments.
;  Angles in degrees, distances in meters (0.01 = 1 cm).
; =====================================================================================

[general]
enabled = 1             ; 1 = on, 0 = off
debug = 0               ; 1 = writes what the head is doing to game.log.txt, twice per second

[mouse look]            ; the mouse moves the head, with weight and inertia (cab only)
mouse_look = 1          ; 1 = mouse handled by the plugin (with inertia), 0 = normal game mouse
mouse_sensitivity = 0.015 ; WEIGHT: degrees per pixel. Lower = heavier head
mouse_weight = 0.22     ; INERTIA: how much the head "glides" after the mouse stops (s). Lower = less inertia
mouse_max_speed = 42    ; WEIGHT: max head turning speed (degrees per second)
mouse_accel = 0.5       ; turning fast in one direction gains up to +50% speed (0 = off)
mouse_invert = 0        ; 1 = invert up/down
mouse_yaw_limit = 150   ; how far you can turn sideways (degrees)
mouse_up_limit = 45
mouse_down_limit = 60
mouse_recenter_key = 0  ; key to recenter the head (e.g. 0x43 = C). 0 = none

[camera]                ; the plugin only takes the mouse inside the cab. It knows the camera by the keys:
camera_inside_keys = 0x31                                    ; key 1 = interior camera
camera_outside_keys = 0x32 0x33 0x34 0x35 0x36 0x37 0x38 0x39 ; keys 2 to 9 = outside cameras
; If you changed the camera keys in the game, put the new codes here. With TM Real Walk
; (walking mod) installed, the plugin uses the camera it reports and stays idle while you walk.

[head zoom]             ; holding the middle mouse button, the head leans toward where you are looking
lean_key = 0x04         ; key (0x04 = middle mouse button). 0 = off
lean_toggle = 0         ; 0 = hold, 1 = press once to lean, press again to return
lean_forward = 0.30     ; how far the head moves forward (m)
lean_down = 0.03        ; how much it lowers (m)
lean_pitch_deg = 2      ; how much the gaze tilts down (degrees)
lean_time = 0.7         ; speed: seconds to lean/return. Higher = slower

[seat position]         ; moves the view a bit away from the windshield, like real life
seat_back = 0.08        ; head further back (m)
seat_up = 0.02          ; head higher (m)
seat_right = 0.0        ; to the right (m)
seat_pitch_deg = 0      ; tilt the gaze (degrees, negative = lower)

[look into turns]
look_steer_deg = 3      ; maneuvering with full lock, the head turns this many degrees to the side
look_steer_until = 45   ; km/h where this maneuvering look fades out
look_ahead_time = 0.25  ; on the road: looks where the truck will be (strength)
look_ahead_from = 25    ; km/h from which the look-ahead starts
look_max_deg = 10       ; max automatic head turn
look_smooth = 0.80      ; higher = slower and smoother head turns

[stabilized gaze]       ; the neck compensates the cab tilt, like in real life: the horizon stays
                        ; steadier when the cab rocks under braking, in turns and over bumps
stabilize_pitch = 0.15  ; how much of the forward/back tilt is compensated (0 = none, 1 = all)
stabilize_roll = 0.15   ; how much of the sideways tilt is compensated
stabilize_time = 0.25   ; neck reaction time (s)
stabilize_max_deg = 1.5  ; compensation limit (degrees)

[body inertia]          ; how much the body is thrown in the seat (m per m/s2 of acceleration)
cabin_inertia = 0.3     ; the body feels the cab tilting and rocking, not just the chassis (0 = chassis only)
lean_side = 0.011       ; turns
lean_fwd = 0.009        ; braking and accelerating
bounce_up = 0           ; potholes and bumps
body_freq = 1.8         ; body "spring" in the seat (Hz). Lower = softer
body_damp = 0.55        ; damping (1 = no sway, 0.3 = sways a lot)
bounce_freq = 3.0
roll_from_side_deg = 2.0   ; head tilts sideways in turns
pitch_from_fwd_deg = 1.5   ; head nods forward when braking
max_offset = 0.08       ; max body displacement (m)

[life]
breath_pitch_deg = 0.22 ; breathing (0 = off)
breath_up = 0.0035
breath_period = 4.2     ; seconds per breath
idle_sway_deg = 0.35    ; slow natural head sway (degrees). 0 = off
idle_sway_m = 0.004     ; slow natural sideways body sway (m)

[surface]               ; the head follows surface changes very gently (no camera shake)
; When the wheels go from asphalt to dirt/gravel/grass, the cab dips slightly and the head follows;
; back on asphalt, it rises. Front axle first, then the rear ones. On rough ground there is a slow,
; small rocking. Everything grows with speed (values at 60 km/h).
surface_feel = 1.0             ; overall strength (0 = off, 0.5 = half, 2 = double)
surface_step = 0.0035          ; how much the head dips/rises on a surface change (m)
surface_step_pitch_deg = 0.18  ; head nod on a surface change (degrees)
surface_step_roll_deg = 0.25   ; tilt when only one side of the wheels changes surface (degrees)
surface_rock = 0.0025          ; rocking on rough ground (m)
surface_rock_roll_deg = 0.12   ; sideways rocking on rough ground (degrees)
surface_freq = 1.6             ; cab/seat "spring" on a surface change (Hz). Lower = softer
; Roughness of each surface (0 = smooth, 1 = very rough). Use the game surface name after rough_.
; Defaults: road 0, road_coarse 0.12, concrete 0.18, metal 0.22, rumble_stripe 0.3, wood 0.35,
;           road_dirt 0.55, gravel 0.7, dirt 0.8, grass 0.9, road_snow 0.25, snow 0.5, ice 0.08
; Example:  rough_gravel = 0.6
