; =====================================================================================
;  SZNT VIEW 1.0 beta - cabeza y mirada realistas en la cabina (ETS2 / ATS)
; =====================================================================================
;  Funciona como un head tracker virtual (como TrackIR). Cambia el número y GUARDA:
;  el juego lo vuelve a leer en medio segundo. Las líneas con ; son solo explicación.
;  Ángulos en grados, distancias en metros (0.01 = 1 cm).
; =====================================================================================

[general]
enabled = 1             ; 1 = activado, 0 = desactivado
debug = 0               ; 1 = escribe en game.log.txt, dos veces por segundo, lo que hace la cabeza

[mirar con el raton]    ; el ratón mueve la cabeza, con peso e inercia (solo en la cabina)
mouse_look = 1          ; 1 = ratón del plugin (con inercia), 0 = ratón normal del juego
mouse_sensitivity = 0.015 ; PESO: grados por píxel. Menor = cabeza más pesada
mouse_weight = 0.22     ; INERCIA: cuánto "se desliza" la cabeza cuando el ratón para (s). Menor = menos inercia
mouse_max_speed = 42    ; PESO: velocidad máxima de giro de la cabeza (grados por segundo)
mouse_accel = 0.5       ; girando rápido hacia un mismo lado, gana hasta +50% de velocidad (0 = desactivado)
mouse_invert = 0        ; 1 = invierte arriba/abajo
mouse_yaw_limit = 150   ; cuánto se puede girar hacia los lados (grados)
mouse_up_limit = 45
mouse_down_limit = 60
mouse_recenter_key = 0  ; tecla para centrar la cabeza (p. ej. 0x43 = C). 0 = ninguna

[camara]                ; el plugin solo usa el ratón dentro de la cabina. Sabe la cámara por las teclas:
camera_inside_keys = 0x31                                    ; tecla 1 = cámara interior
camera_outside_keys = 0x32 0x33 0x34 0x35 0x36 0x37 0x38 0x39 ; teclas 2 a 9 = cámaras exteriores
; Si cambiaste las teclas de cámara en el juego, pon aquí los códigos nuevos. Con TM Real Walk
; (mod para caminar) instalado, el plugin usa la cámara que él informa y se detiene mientras caminas.

[zoom de cabeza]        ; manteniendo el botón central del ratón, la cabeza se inclina hacia donde miras
lean_key = 0x04         ; tecla (0x04 = botón central del ratón). 0 = desactivado
lean_toggle = 0         ; 0 = mantener, 1 = pulsa una vez para inclinarte, otra vez para volver
lean_forward = 0.30     ; cuánto va la cabeza hacia delante (m)
lean_down = 0.03        ; cuánto baja (m)
lean_pitch_deg = 2      ; cuánto baja un poco la mirada (grados)
lean_time = 0.7         ; velocidad: segundos para inclinarse/volver. Mayor = más lento

[posicion del asiento]  ; aleja un poco la vista del parabrisas, como en la vida real
seat_back = 0.08        ; cabeza más atrás (m)
seat_up = 0.02          ; cabeza más alta (m)
seat_right = 0.0        ; a la derecha (m)
seat_pitch_deg = 0      ; inclinar la mirada (grados, negativo = más abajo)

[mirar en las curvas]
look_steer_deg = 3      ; en maniobra, con el volante a tope, la cabeza gira estos grados hacia el lado
look_steer_until = 45   ; km/h en los que esta mirada de maniobra desaparece
look_ahead_time = 0.25  ; en carretera: mira hacia donde estará el camión (intensidad)
look_ahead_from = 25    ; km/h desde los que entra la mirada anticipada
look_max_deg = 10       ; límite del giro automático de la cabeza
look_smooth = 0.80      ; mayor = la cabeza gira más lenta y suave

[mirada estable]        ; el cuello compensa la inclinación de la cabina, como en la vida real: el horizonte
                        ; queda más firme cuando la cabina se balancea al frenar, en curvas y en baches
stabilize_pitch = 0.15  ; cuánto de la inclinación adelante/atrás se compensa (0 = nada, 1 = todo)
stabilize_roll = 0.15   ; cuánto de la inclinación lateral se compensa
stabilize_time = 0.25   ; tiempo de reacción del cuello (s)
stabilize_max_deg = 1.5  ; límite de la compensación (grados)

[inercia del cuerpo]    ; cuánto se mueve el cuerpo en el asiento (m por m/s2 de aceleración)
cabin_inertia = 0.3     ; el cuerpo siente la cabina inclinarse y balancearse, no solo el chasis (0 = solo el chasis)
lean_side = 0.011       ; curvas
lean_fwd = 0.009        ; frenadas y arrancadas
bounce_up = 0           ; baches y badenes
body_freq = 1.8         ; "muelle" del cuerpo en el asiento (Hz). Menor = más blando
body_damp = 0.55        ; amortiguación (1 = sin balanceo, 0.3 = se balancea mucho)
bounce_freq = 3.0
roll_from_side_deg = 2.0   ; la cabeza se inclina de lado en las curvas
pitch_from_fwd_deg = 1.5   ; la cabeza cabecea hacia delante al frenar
max_offset = 0.08       ; límite del desplazamiento del cuerpo (m)

[vida]
breath_pitch_deg = 0.22 ; respiración (0 = desactivado)
breath_up = 0.0035
breath_period = 4.2     ; segundos por respiración
idle_sway_deg = 0.35    ; balanceo natural lento de la cabeza (grados). 0 = desactivado
idle_sway_m = 0.004     ; balanceo natural del cuerpo hacia los lados (m)

[suelo]                 ; la cabeza acompaña muy suavemente los cambios de suelo (sin temblores de cámara)
; Cuando las ruedas pasan del asfalto a tierra/grava/hierba, la cabina baja un poco y la cabeza acompaña;
; al volver al asfalto, sube. Primero el eje delantero, luego los traseros. En suelo irregular hay un
; balanceo lento y pequeño. Todo crece con la velocidad (valores a 60 km/h).
surface_feel = 1.0             ; fuerza general (0 = desactivado, 0.5 = mitad, 2 = doble)
surface_step = 0.0035          ; cuánto baja/sube la cabeza al cambiar de suelo (m)
surface_step_pitch_deg = 0.18  ; cabeceo al cambiar de suelo (grados)
surface_step_roll_deg = 0.25   ; inclinación cuando solo un lado de las ruedas cambia de suelo (grados)
surface_rock = 0.0025          ; balanceo en suelo irregular (m)
surface_rock_roll_deg = 0.12   ; balanceo lateral en suelo irregular (grados)
surface_freq = 1.6             ; "muelle" de la cabina/asiento al cambiar de suelo (Hz). Menor = más blando
; Irregularidad de cada suelo (0 = liso, 1 = muy irregular). Usa el nombre del suelo del juego después de rough_.
; Por defecto: road 0, road_coarse 0.12, concrete 0.18, metal 0.22, rumble_stripe 0.3, wood 0.35,
;              road_dirt 0.55, gravel 0.7, dirt 0.8, grass 0.9, road_snow 0.25, snow 0.5, ice 0.08
; Ejemplo:  rough_gravel = 0.6
