; =====================================================================================
;  SZNT VIEW 1.0 beta - realistischer Kopf und Blick in der Kabine (ETS2 / ATS)
; =====================================================================================
;  Funktioniert wie ein virtueller Head-Tracker (wie TrackIR). Ändere die Zahl und SPEICHERE:
;  das Spiel liest die Datei nach einer halben Sekunde neu. Zeilen mit ; sind nur Erklärungen.
;  Winkel in Grad, Abstände in Metern (0.01 = 1 cm).
; =====================================================================================

[allgemein]
enabled = 1             ; 1 = an, 0 = aus
debug = 0               ; 1 = schreibt zweimal pro Sekunde in game.log.txt, was der Kopf macht

[mausblick]             ; die Maus bewegt den Kopf, mit Gewicht und Trägheit (nur in der Kabine)
mouse_look = 1          ; 1 = Maus über das Plugin (mit Trägheit), 0 = normale Spielmaus
mouse_sensitivity = 0.015 ; GEWICHT: Grad pro Pixel. Kleiner = schwererer Kopf
mouse_weight = 0.22     ; TRÄGHEIT: wie stark der Kopf nach dem Anhalten der Maus "nachgleitet" (s). Kleiner = weniger Trägheit
mouse_max_speed = 42    ; GEWICHT: maximale Drehgeschwindigkeit des Kopfes (Grad pro Sekunde)
mouse_accel = 0.5       ; schnelles Drehen in eine Richtung bringt bis zu +50% Tempo (0 = aus)
mouse_invert = 0        ; 1 = oben/unten umkehren
mouse_yaw_limit = 150   ; wie weit du zur Seite drehen kannst (Grad)
mouse_up_limit = 45
mouse_down_limit = 60
mouse_recenter_key = 0  ; Taste zum Zentrieren des Kopfes (z. B. 0x43 = C). 0 = keine

[kamera]                ; das Plugin übernimmt die Maus nur in der Kabine. Es erkennt die Kamera an den Tasten:
camera_inside_keys = 0x31                                    ; Taste 1 = Innenkamera
camera_outside_keys = 0x32 0x33 0x34 0x35 0x36 0x37 0x38 0x39 ; Tasten 2 bis 9 = Außenkameras
; Wenn du die Kameratasten im Spiel geändert hast, trage hier die neuen Codes ein. Mit TM Real Walk
; (Lauf-Mod) nutzt das Plugin die Kamera, die er meldet, und pausiert, während du läufst.

[kopf-zoom]             ; mit gedrückter mittlerer Maustaste beugt sich der Kopf in Blickrichtung vor
lean_key = 0x04         ; Taste (0x04 = mittlere Maustaste). 0 = aus
lean_toggle = 0         ; 0 = halten, 1 = einmal drücken zum Vorbeugen, nochmal zum Zurückgehen
lean_forward = 0.30     ; wie weit der Kopf nach vorne geht (m)
lean_down = 0.03        ; wie weit er sinkt (m)
lean_pitch_deg = 2      ; wie stark der Blick etwas nach unten geht (Grad)
lean_time = 0.7         ; Tempo: Sekunden zum Vorbeugen/Zurückgehen. Größer = langsamer

[sitzposition]          ; rückt die Sicht etwas von der Windschutzscheibe weg, wie im echten Leben
seat_back = 0.08        ; Kopf weiter hinten (m)
seat_up = 0.02          ; Kopf höher (m)
seat_right = 0.0        ; nach rechts (m)
seat_pitch_deg = 0      ; Blick neigen (Grad, negativ = tiefer)

[in die kurve schauen]
look_steer_deg = 3      ; beim Rangieren mit vollem Einschlag dreht der Kopf so viele Grad zur Seite
look_steer_until = 45   ; km/h, bei denen dieser Rangierblick verschwindet
look_ahead_time = 0.25  ; auf der Straße: schaut dorthin, wo der Truck gleich sein wird (Stärke)
look_ahead_from = 25    ; km/h, ab denen der vorausschauende Blick einsetzt
look_max_deg = 10       ; Grenze der automatischen Kopfdrehung
look_smooth = 0.80      ; größer = Kopf dreht langsamer und sanfter

[ruhiger blick]         ; der Nacken gleicht die Neigung der Kabine aus, wie im echten Leben: der Horizont
                        ; bleibt ruhiger, wenn die Kabine beim Bremsen, in Kurven und über Bodenwellen schwankt
stabilize_pitch = 0.15  ; wie viel der Neigung nach vorne/hinten ausgeglichen wird (0 = nichts, 1 = alles)
stabilize_roll = 0.15   ; wie viel der seitlichen Neigung ausgeglichen wird
stabilize_time = 0.25   ; Reaktionszeit des Nackens (s)
stabilize_max_deg = 1.5  ; Grenze des Ausgleichs (Grad)

[koerpertraegheit]      ; wie stark der Körper im Sitz bewegt wird (m pro m/s2 Beschleunigung)
cabin_inertia = 0.3     ; der Körper spürt das Neigen und Schwanken der Kabine, nicht nur das Chassis (0 = nur Chassis)
lean_side = 0.011       ; Kurven
lean_fwd = 0.009        ; Bremsen und Anfahren
bounce_up = 0           ; Schlaglöcher und Bodenwellen
body_freq = 1.8         ; "Feder" des Körpers im Sitz (Hz). Kleiner = weicher
body_damp = 0.55        ; Dämpfung (1 = kein Schwanken, 0.3 = schwankt stark)
bounce_freq = 3.0
roll_from_side_deg = 2.0   ; Kopf neigt sich in Kurven zur Seite
pitch_from_fwd_deg = 1.5   ; Kopf nickt beim Bremsen nach vorne
max_offset = 0.08       ; Grenze der Körperbewegung (m)

[leben]
breath_pitch_deg = 0.22 ; Atmung (0 = aus)
breath_up = 0.0035
breath_period = 4.2     ; Sekunden pro Atemzug
idle_sway_deg = 0.35    ; langsames natürliches Kopfschwanken (Grad). 0 = aus
idle_sway_m = 0.004     ; langsames natürliches seitliches Körperschwanken (m)

[untergrund]            ; der Kopf folgt Untergrundwechseln ganz sanft (kein Kamerawackeln)
; Wenn die Räder von Asphalt auf Erde/Schotter/Gras wechseln, sinkt die Kabine leicht und der Kopf folgt;
; zurück auf Asphalt hebt sie sich. Erst die Vorderachse, dann die hinteren. Auf unebenem Boden gibt es ein
; langsames, kleines Schaukeln. Alles wächst mit dem Tempo (Werte bei 60 km/h).
surface_feel = 1.0             ; Gesamtstärke (0 = aus, 0.5 = halb, 2 = doppelt)
surface_step = 0.0035          ; wie weit der Kopf beim Untergrundwechsel sinkt/steigt (m)
surface_step_pitch_deg = 0.18  ; Nicken beim Untergrundwechsel (Grad)
surface_step_roll_deg = 0.25   ; Neigung, wenn nur eine Radseite den Untergrund wechselt (Grad)
surface_rock = 0.0025          ; Schaukeln auf unebenem Boden (m)
surface_rock_roll_deg = 0.12   ; seitliches Schaukeln auf unebenem Boden (Grad)
surface_freq = 1.6             ; "Feder" von Kabine/Sitz beim Untergrundwechsel (Hz). Kleiner = weicher
; Unebenheit jedes Untergrunds (0 = glatt, 1 = sehr uneben). Den Untergrundnamen des Spiels nach rough_ angeben.
; Standard: road 0, road_coarse 0.12, concrete 0.18, metal 0.22, rumble_stripe 0.3, wood 0.35,
;           road_dirt 0.55, gravel 0.7, dirt 0.8, grass 0.9, road_snow 0.25, snow 0.5, ice 0.08
; Beispiel:  rough_gravel = 0.6
