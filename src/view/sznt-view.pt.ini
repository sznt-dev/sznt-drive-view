; =====================================================================================
;  SZNT VIEW 1.0 beta - cabeca e olhar realistas na cabine (ETS2 / ATS)
; =====================================================================================
;  Funciona como um head tracker virtual (igual TrackIR). Mude o numero e SALVE:
;  o jogo le de novo em meio segundo. Linhas com ; sao so explicacao.
;  Angulos em graus, distancias em metros (0.01 = 1 cm).
; =====================================================================================

[geral]
enabled = 1             ; 1 = ligado, 0 = desligado
debug = 0               ; 1 = escreve no game.log.txt, 2x por segundo, o que a cabeca esta fazendo

[olhar com o mouse]     ; o mouse move a cabeca, com peso e inercia (so na cabine)
mouse_look = 1          ; 1 = mouse pelo plugin (com inercia), 0 = mouse normal do jogo
mouse_sensitivity = 0.015 ; PESO: graus por pixel. Menor = cabeca mais pesada de virar
mouse_weight = 0.22     ; INERCIA: quanto a cabeca "escorrega" depois que o mouse para (s). Menor = menos inercia
mouse_max_speed = 42    ; PESO: velocidade maxima de giro da cabeca (graus por segundo)
mouse_accel = 0.5       ; virando rapido e direto pro mesmo lado, ganha ate +50% de velocidade (0 = desliga)
mouse_invert = 0        ; 1 = inverte cima/baixo
mouse_yaw_limit = 150   ; quanto da pra virar pros lados (graus)
mouse_up_limit = 45
mouse_down_limit = 60
mouse_recenter_key = 0  ; tecla para centralizar a cabeca (ex.: 0x43 = C). 0 = nenhuma

[camera]                ; o plugin so mexe no mouse dentro da cabine. Ele sabe a camera pelas teclas:
camera_inside_keys = 0x31                                    ; tecla 1 = camera interna
camera_outside_keys = 0x32 0x33 0x34 0x35 0x36 0x37 0x38 0x39 ; teclas 2 a 9 = cameras de fora
; Se voce mudou as teclas de camera no jogo, coloque aqui os codigos novos. Com o TM Real Walk
; (andar a pe) instalado, o plugin usa a camera informada por ele e fica parado enquanto voce anda.

[zoom de cabeca]        ; segurando o botao do meio do mouse, a cabeca se inclina na direcao para onde voce esta olhando
lean_key = 0x04         ; tecla (0x04 = botao do meio do mouse). 0 = desliga
lean_toggle = 0         ; 0 = segurar, 1 = aperta uma vez inclina, aperta de novo volta
lean_forward = 0.30     ; quanto a cabeca vai pra frente (m)
lean_down = 0.03        ; quanto abaixa (m)
lean_pitch_deg = 2      ; quanto o olhar desce um pouco (graus)
lean_time = 0.7         ; velocidade: segundos para inclinar/voltar. Maior = mais lento

[posicao do banco]      ; deixa a visao mais "afastada" do para-brisa, como na vida real
seat_back = 0.08        ; cabeca mais para tras (m)
seat_up = 0.02          ; cabeca mais alta (m)
seat_right = 0.0        ; para a direita (m)
seat_pitch_deg = 0      ; inclinar o olhar (graus, negativo = mais pra baixo)

[olhar para a curva]
look_steer_deg = 3      ; em manobra, com o volante todo virado, a cabeca vira tantos graus para o lado
look_steer_until = 45   ; km/h em que esse olhar de manobra some
look_ahead_time = 0.25  ; na estrada: olha para onde o caminhao vai estar daqui a X segundos
look_ahead_from = 25    ; km/h a partir do qual o olhar adiante entra
look_max_deg = 10       ; limite de quanto a cabeca vira sozinha
look_smooth = 0.80      ; quanto maior, mais devagar e suave a cabeca gira

[olhar estabilizado]    ; o pescoco compensa a inclinacao da cabine, como na vida real: o horizonte fica
                        ; mais firme quando a cabine balanca em freadas, curvas e lombadas
stabilize_pitch = 0.15  ; quanto da inclinacao para frente/tras e compensada (0 = nada, 1 = tudo)
stabilize_roll = 0.15   ; quanto da inclinacao de lado e compensada
stabilize_time = 0.25   ; tempo de reacao do pescoco (s)
stabilize_max_deg = 1.5  ; limite da compensacao (graus)

[inercia do corpo]      ; quanto o corpo e jogado no banco (m por m/s2 de aceleracao)
cabin_inertia = 0.3     ; o corpo sente a cabine tombando e balancando, nao so o chassi (0 = so o chassi)
lean_side = 0.011       ; curvas
lean_fwd = 0.009        ; freadas e arrancadas
bounce_up = 0           ; buracos e lombadas
body_freq = 1.8         ; "mola" do corpo no banco (Hz). Menor = mais mole
body_damp = 0.55        ; amortecimento (1 = sem balanco, 0.3 = balanca bastante)
bounce_freq = 3.0
roll_from_side_deg = 2.0   ; cabeca inclina de lado nas curvas
pitch_from_fwd_deg = 1.5   ; cabeca acena pra frente nas freadas
max_offset = 0.08       ; limite do deslocamento do corpo (m)

[vida]
breath_pitch_deg = 0.22 ; respiracao (0 = desliga)
breath_up = 0.0035
breath_period = 4.2     ; segundos por respiracao
idle_sway_deg = 0.35    ; balanco natural lento da cabeca (graus). 0 = desliga
idle_sway_m = 0.004     ; balanco natural do corpo de lado (m)

[piso]                  ; a cabeca acompanha, bem de leve, a troca de piso (sem tremida)
; Quando as rodas passam do asfalto para terra/cascalho/grama, a cabine afunda um pouco e a cabeca
; acompanha; voltando para o asfalto, ela sobe. Primeiro o eixo da frente, depois o de tras.
; Em chao irregular fica um balanco lento e pequeno. Tudo cresce com a velocidade (valores a 60 km/h).
surface_feel = 1.0             ; forca geral (0 = desliga, 0.5 = metade, 2 = dobro)
surface_step = 0.0035          ; quanto a cabeca desce/sobe na troca de piso (m)
surface_step_pitch_deg = 0.18  ; aceno da cabeca na troca de piso (graus)
surface_step_roll_deg = 0.25   ; inclinacao quando so um lado das rodas troca de piso (graus)
surface_rock = 0.0025          ; balanco em chao irregular (m)
surface_rock_roll_deg = 0.12   ; balanco de lado em chao irregular (graus)
surface_freq = 1.6             ; "mola" da cabine/banco na troca de piso (Hz). Menor = mais macio
; Irregularidade de cada piso (0 = liso, 1 = bem irregular). Use o nome do piso do jogo depois de rough_.
; Padrao: road 0, road_coarse 0.12, concrete 0.18, metal 0.22, rumble_stripe 0.3, wood 0.35,
;         road_dirt 0.55, gravel 0.7, dirt 0.8, grass 0.9, road_snow 0.25, snow 0.5, ice 0.08
; Exemplo:  rough_gravel = 0.6
